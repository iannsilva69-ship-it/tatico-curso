<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Cursos - Tático Curso</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <header>

        <div class="logo">
            TÁTICO CURSO
        </div>

        <nav>
            <a href="admin.html">Painel</a>
            <a href="#" id="sair">Sair</a>
        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="hero-text">

                <span class="tag">
                    GERENCIAR CURSOS
                </span>

                <h1>
                    Cursos
                </h1>

                <p>
                    Crie e gerencie os cursos do Tático Curso.
                </p>

                <button id="novoCurso">
                    ➕ Criar novo curso
                </button>
<div id="formularioCurso" style="display: none; margin-top: 30px;">

    <h2>Novo curso</h2>

    <form id="cursoForm">

        <input
            type="text"
            id="nomeCurso"
            placeholder="Nome do curso"
            required
        >

        <br><br>

        <textarea
            id="descricaoCurso"
            placeholder="Descrição do curso"
            rows="5"
            style="width: 100%; max-width: 600px;"
        ></textarea>

        <br><br>

        <input
            type="number"
            id="precoCurso"
            placeholder="Preço do curso"
            step="0.01"
            min="0"
        >

        <br><br>

        <input
            type="url"
            id="imagemCurso"
            placeholder="Link da imagem do curso"
        >

        <br><br>

        <label>
            <input
                type="checkbox"
                id="ativoCurso"
                checked
            >
            Curso ativo
        </label>

        <br><br>

        <button type="submit">
            💾 Salvar curso
        </button>

        <button
            type="button"
            id="cancelarCurso"
            class="secondary"
        >
            Cancelar
        </button>

    </form>

    <p id="mensagemCurso"></p>

</div>
            </div>

        </section>

        <section class="courses">

            <h2>
                Cursos cadastrados
            </h2>

            <div id="listaCursos">
                Carregando cursos...
            </div>

        </section>

    </main>

    <script src="cursos-admin.js"></script>

</body>

</html>
