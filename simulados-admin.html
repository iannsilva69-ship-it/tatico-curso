<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulados - Tático Curso</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        body.simulados-admin-page {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(200, 163, 85, 0.10), transparent 30%),
                radial-gradient(circle at bottom left, rgba(200, 163, 85, 0.06), transparent 30%),
                #080A0F;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .simulados-admin-page * {
            box-sizing: border-box;
        }

        /* HEADER */

        .simulados-admin-page header {
            min-height: 76px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 10, 15, 0.96);
            border-bottom: 1px solid rgba(200, 163, 85, 0.25);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .simulados-admin-page .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #E5C378;
        }

        .simulados-admin-page nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .simulados-admin-page nav a {
            color: #c8ccd4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s;
        }

        .simulados-admin-page nav a:hover {
            color: #E5C378;
        }

        /* HERO */

        .simulados-admin-page .hero {
            padding: 70px 6% 55px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .simulados-admin-page .hero-text {
            max-width: 900px;
            margin: 0 auto;
        }

        .simulados-admin-page .tag {
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 13px;
            border: 1px solid rgba(200, 163, 85, 0.45);
            border-radius: 999px;
            color: #E5C378;
            background: rgba(200, 163, 85, 0.08);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        .simulados-admin-page h1 {
            margin: 0 0 14px;
            color: #fff;
            font-size: clamp(34px, 5vw, 52px);
            line-height: 1.05;
            font-weight: 900;
        }

        .simulados-admin-page .hero p {
            margin: 0 0 30px;
            color: #aeb4bf;
            font-size: 16px;
            line-height: 1.7;
        }

        /* BOTÕES */

        .simulados-admin-page button {
            border: 0;
            border-radius: 10px;
            padding: 13px 20px;
            background: #C8A355;
            color: #080A0F;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .simulados-admin-page button:hover {
            background: #E5C378;
            transform: translateY(-1px);
        }

        .simulados-admin-page button.secondary {
            background: #202631;
            color: #d7dbe2;
            border: 1px solid #343b47;
            margin-left: 8px;
        }

        .simulados-admin-page button.secondary:hover {
            background: #2a313d;
            color: #fff;
        }

        /* FORMULÁRIO */

        .simulados-admin-page #formularioSimulado {
            margin-top: 30px !important;
            padding: 28px;
            background: #0E121A;
            border: 1px solid rgba(200, 163, 85, 0.25);
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
        }

        .simulados-admin-page #tituloFormulario {
            margin: 0 0 22px;
            color: #E5C378;
            font-size: 22px;
        }

        .simulados-admin-page #simuladoForm {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .simulados-admin-page #simuladoForm br {
            display: none;
        }

        .simulados-admin-page input,
        .simulados-admin-page textarea,
        .simulados-admin-page select {
            width: 100%;
            padding: 14px 15px;
            border-radius: 9px;
            border: 1px solid #303744;
            background: #080A0F;
            color: #fff;
            outline: none;
            font-size: 15px;
            font-family: inherit;
        }

        .simulados-admin-page textarea {
            min-height: 120px;
            resize: vertical;
        }

        .simulados-admin-page input:focus,
        .simulados-admin-page textarea:focus,
        .simulados-admin-page select:focus {
            border-color: #C8A355;
            box-shadow: 0 0 0 3px rgba(200, 163, 85, 0.10);
        }

        .simulados-admin-page input::placeholder,
        .simulados-admin-page textarea::placeholder {
            color: #777f8d;
        }

        .simulados-admin-page label {
            color: #aeb4bf;
            font-size: 13px;
            font-weight: 700;
        }

        .simulados-admin-page select {
            cursor: pointer;
        }

        .simulados-admin-page option {
            background: #0E121A;
            color: #fff;
        }

        .simulados-admin-page #mensagemSimulado {
            margin: 18px 0 0;
            color: #C8A355;
            font-weight: 700;
        }

        /* LISTA */

        .simulados-admin-page .courses {
            width: 88%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 55px 0 80px;
        }

        .simulados-admin-page .courses > h2 {
            margin: 0 0 25px;
            color: #fff;
            font-size: 28px;
            font-weight: 900;
        }

        .simulados-admin-page #listaSimulados {
            display: grid;
            gap: 16px;
        }

        .simulados-admin-page #listaSimulados > * {
            background: #0E121A;
            border: 1px solid #252C36;
            border-radius: 14px;
            padding: 22px;
            transition: 0.2s;
        }

        .simulados-admin-page #listaSimulados > *:hover {
            border-color: rgba(200, 163, 85, 0.45);
            transform: translateY(-2px);
        }

        /* RESPONSIVO */

        @media (max-width: 700px) {

            .simulados-admin-page header {
                padding: 16px 5%;
                flex-direction: column;
                gap: 14px;
            }

            .simulados-admin-page nav {
                gap: 16px;
            }

            .simulados-admin-page .hero {
                padding: 50px 5% 40px;
            }

            .simulados-admin-page .courses {
                width: 90%;
                padding-top: 40px;
            }

            .simulados-admin-page #formularioSimulado {
                padding: 20px;
            }

            .simulados-admin-page button.secondary {
                margin-left: 0;
                margin-top: 8px;
            }
        }

    </style>

</head>


<body class="simulados-admin-page">

    <header>

        <div class="logo">
            TÁTICO CURSO
        </div>

        <nav>

            <a href="admin.html">
                Painel
            </a>

            <a href="#" id="sair">
                Sair
            </a>

        </nav>

    </header>


    <main>

        <section class="hero">

            <div class="hero-text">

                <span class="tag">
                    GERENCIAR SIMULADOS
                </span>

                <h1>
                    Simulados
                </h1>

                <p>
                    Cadastre provas e simulados completos em PDF.
                </p>


                <button id="novoSimulado">
                    ➕ Criar novo simulado
                </button>


                <div
                    id="formularioSimulado"
                    style="display:none;"
                >

                    <h2 id="tituloFormulario">
                        Novo simulado
                    </h2>


                    <form id="simuladoForm">

                        <input
                            type="text"
                            id="tituloSimulado"
                            placeholder="Nome do simulado"
                            required
                        >


                        <textarea
                            id="descricaoSimulado"
                            placeholder="Descrição do simulado"
                            rows="4"
                        ></textarea>


                        <input
                            type="url"
                            id="pdfSimulado"
                            placeholder="Link do PDF do simulado"
                            required
                        >


                        <label>
                            Status do simulado
                        </label>


                        <select id="ativoSimulado">

                            <option value="true">
                                Ativo
                            </option>

                            <option value="false">
                                Inativo
                            </option>

                        </select>


                        <div>

                            <button type="submit">
                                💾 Salvar simulado
                            </button>


                            <button
                                type="button"
                                id="cancelarSimulado"
                                class="secondary"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>


                    <p id="mensagemSimulado"></p>

                </div>

            </div>

        </section>


        <section class="courses">

            <h2>
                Simulados cadastrados
            </h2>


            <div id="listaSimulados">

                Carregando simulados...

            </div>

        </section>

    </main>


    <script src="simulados-admin.js"></script>

</body>

</html>
