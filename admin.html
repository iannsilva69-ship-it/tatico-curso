<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Sócio - Tático Curso</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================================
           ÁREA DO SÓCIO - TÁTICOS
           ========================================================= */

        body.admin-page {
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(200, 163, 85, 0.10),
                    transparent 30%
                ),
                #080A0F !important;

            color: #ffffff !important;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        body.admin-page > header {

            min-height: 76px;

            padding: 0 6%;

            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(8, 10, 15, 0.97);

            border-bottom: 1px solid rgba(200, 163, 85, 0.22);
        }

        body.admin-page > header h1 {

            margin: 0;

            color: #E5C378;

            font-size: 22px;

            font-weight: 900;

            letter-spacing: 2px;
        }

        body.admin-page > header p {

            margin: 4px 0 0;

            color: #8f96a3;

            font-size: 12px;
        }


        /* =========================================================
           BOTÃO SAIR
           ========================================================= */

        body.admin-page #logout {

            padding: 10px 20px;

            border: 1px solid rgba(200, 163, 85, 0.35);

            border-radius: 8px;

            background: transparent;

            color: #E5C378;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        body.admin-page #logout:hover {

            background: rgba(200, 163, 85, 0.10);

            transform: translateY(-1px);
        }


        /* =========================================================
           CONTEÚDO
           ========================================================= */

        body.admin-page main {

            width: 100%;

            max-width: 1100px;

            margin: 0 auto;

            padding: 50px 24px 80px;

            box-sizing: border-box;
        }


        /* =========================================================
           BOAS-VINDAS
           ========================================================= */

        body.admin-page .boas-vindas {

            margin-bottom: 40px;

            padding: 32px;

            border-radius: 18px;

            border: 1px solid rgba(200, 163, 85, 0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(200, 163, 85, 0.08),
                    rgba(14, 18, 26, 0.96)
                );

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.20);
        }

        body.admin-page .boas-vindas h2 {

            margin: 0 0 10px;

            color: #ffffff;

            font-size: 30px;

            font-weight: 900;
        }

        body.admin-page .boas-vindas p {

            margin: 0;

            color: #aeb4bf;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =========================================================
           TÍTULO
           ========================================================= */

        body.admin-page main > section:not(.boas-vindas) > h2 {

            margin: 0 0 22px;

            color: #ffffff;

            font-size: 23px;

            font-weight: 850;
        }


        /* =========================================================
           MENU ADMINISTRATIVO
           ========================================================= */

        body.admin-page .admin-menu {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

            width: 100%;
        }


        /* =========================================================
           BOTÕES
           ========================================================= */

        body.admin-page .admin-menu button {

            min-height: 150px;

            padding: 25px 20px;

            border: 1px solid rgba(200, 163, 85, 0.20);

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    #0E121A,
                    #0A0D13
                );

            color: #E5E7EB;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.20);

            transition:
                transform 0.2s,
                border-color 0.2s,
                background 0.2s;
        }

        body.admin-page .admin-menu button:hover {

            transform: translateY(-4px);

            border-color: rgba(200, 163, 85, 0.55);

            background:
                linear-gradient(
                    145deg,
                    #141923,
                    #0E121A
                );
        }


        /* =========================================================
           PRIMEIRO BOTÃO
           ========================================================= */

        body.admin-page .admin-menu button:first-child {

            border-top: 3px solid #C8A355;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 800px) {

            body.admin-page .admin-menu {

                grid-template-columns: 1fr 1fr;
            }
        }


        @media (max-width: 600px) {

            body.admin-page > header {

                min-height: 70px;

                padding: 14px 18px;
            }

            body.admin-page > header h1 {

                font-size: 18px;
            }

            body.admin-page > header p {

                font-size: 11px;
            }

            body.admin-page #logout {

                padding: 9px 15px;

                font-size: 12px;
            }

            body.admin-page main {

                padding: 30px 15px 50px;
            }

            body.admin-page .boas-vindas {

                padding: 25px 20px;

                border-radius: 14px;
            }

            body.admin-page .boas-vindas h2 {

                font-size: 24px;
            }

            body.admin-page .admin-menu {

                grid-template-columns: 1fr;

                gap: 15px;
            }

            body.admin-page .admin-menu button {

                min-height: 100px;
            }
        }

    </style>

</head>


<body class="admin-page">


<header>

    <div>

        <h1>
            TÁTICO CURSO
        </h1>

        <p>
            Área do Sócio
        </p>

    </div>


    <button id="logout">
        Sair
    </button>

</header>


<main>


    <section class="boas-vindas">

        <h2>
            Administrador
        </h2>

        <p>
            Gerencie os conteúdos e alunos da plataforma.
        </p>

    </section>


    <section>

        <h2>
            ⚙️ Administração
        </h2>


        <div class="admin-menu">


            <button
                onclick="window.location.href='cursos-admin.html'"
            >
                📚 Gerenciar Cursos
            </button>


            <button
                onclick="window.location.href='simulados-admin.html'"
            >
                📝 Gerenciar Simulados
            </button>


            <button
                onclick="window.location.href='socios-admin.html'"
            >
                👥 Gerenciar Sócios
            </button>


        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="admin.js"></script>

</body>

</html>
