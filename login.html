<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Táticos Concursos</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body.login-page {
            margin: 0 !important;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(200, 163, 85, 0.10),
                    transparent 35%
                ),
                #080a0f !important;
            color: #ffffff !important;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        body.login-page::before {
            opacity: 0.05 !important;
            z-index: 0 !important;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
        }

        /* MARCA TÁTICOS CONCURSOS */

        .login-brand {
            text-align: center;
            margin-bottom: 25px;
            padding: 18px;
            border: 1px solid rgba(200, 163, 85, 0.35);
            border-radius: 18px;
            background: linear-gradient(
                145deg,
                rgba(18, 22, 30, 0.98),
                rgba(10, 13, 19, 0.98)
            );
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* QUADRADO DA IMAGEM */

        .login-brand-symbol {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            height: auto;
            margin: 0 auto 14px;
            padding: 0;
            border: 1px solid rgba(200, 163, 85, 0.45);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080a0f;
            box-shadow: 0 0 30px rgba(200, 163, 85, 0.16);
        }

        .login-brand-symbol img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .login-brand-name {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ffffff;
        }

        .login-brand-sub {
            margin-top: 6px;
            font-size: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4af37;
        }

        /* CARTÃO DO LOGIN */

        .login-card {
            background: linear-gradient(
                145deg,
                rgba(18, 22, 30, 0.98),
                rgba(10, 13, 19, 0.98)
            );
            border: 1px solid rgba(200, 163, 85, 0.30);
            border-radius: 18px;
            padding: 34px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 0 35px rgba(200, 163, 85, 0.025);
        }

        .login-card h1 {
            margin: 0;
            color: #ffffff;
            font-size: 29px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .login-card-description {
            margin: 9px 0 25px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.6;
        }

        /* CAMPOS */

        .login-field {
            margin-bottom: 17px;
        }

        .login-field label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-field input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            outline: none;
            background: #080a0f;
            color: #ffffff;
            font-size: 13px;
            transition: 0.2s;
        }

        .login-field input::placeholder {
            color: #64748b;
        }

        .login-field input:focus {
            border-color: rgba(200, 163, 85, 0.70);
            box-shadow: 0 0 0 3px rgba(200, 163, 85, 0.08);
        }

        /* BOTÃO */

        .login-button {
            width: 100%;
            min-height: 47px;
            margin-top: 7px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #e5c378, #b88b2f);
            color: #080a0f;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(200, 163, 85, 0.16);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(200, 163, 85, 0.30);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        /* MENSAGENS */

        #mensagem {
            min-height: 20px;
            margin: 15px 0 5px;
            color: #e5c378;
            font-size: 11px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* CADASTRO */

        .login-register {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }

        .login-register a {
            color: #e5c378;
            font-weight: 800;
            text-decoration: none;
        }

        .login-register a:hover {
            text-decoration: underline;
        }

        /* VOLTAR */

        .login-back {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            font-size: 10px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-back:hover {
            color: #e5c378;
        }

        /* CELULAR */

        @media (max-width: 520px) {
            body.login-page {
                padding: 18px 14px;
            }

            .login-wrapper {
                max-width: 440px;
            }

            .login-brand {
                padding: 14px;
                margin-bottom: 20px;
            }

            .login-brand-symbol {
                width: 100%;
                max-width: 360px;
                aspect-ratio: 1 / 1;
            }

            .login-card {
                padding: 26px 21px;
            }

            .login-card h1 {
                font-size: 24px;
            }

            .login-brand-name {
                font-size: 21px;
                letter-spacing: 5px;
            }
        }
    </style>
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-brand">

            <div class="login-brand-symbol">
                <img
                    src="logo-taticos.png"
                    alt="Táticos Concursos"
                >
            </div>

            <div class="login-brand-name">
                TÁTICOS
            </div>

            <div class="login-brand-sub">
                Concursos
            </div>

        </div>

        <section class="login-card">

            <h1>Entrar</h1>

            <p class="login-card-description">
                Acesse sua área de aluno e continue sua preparação.
            </p>

            <form id="loginForm">

                <div class="login-field">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar na plataforma →
                </button>

            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <div class="login-register">
                Ainda não possui uma conta?

                <a href="cadastro.html">Criar conta</a>
            </div>

            <a href="index.html" class="login-back">
                ← Voltar para o início
            </a>

        </section>

    </div>

    <script src="login.js"></script>

</body>
</html>
