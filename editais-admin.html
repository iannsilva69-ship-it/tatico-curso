<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Editais - TÁTICOS CURSO</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header
        style="
            width:100%;
            border-bottom:1px solid #2a2f38;
            background:#080a0f;
        "
    >

        <div
            style="
                max-width:1200px;
                margin:auto;
                padding:18px 20px;
                display:flex;
                align-items:center;
                justify-content:space-between;
                gap:20px;
            "
        >

            <div>

                <div
                    style="
                        color:#ffffff;
                        font-size:20px;
                        font-weight:800;
                        letter-spacing:1px;
                    "
                >
                    TÁTICOS CURSO
                </div>


                <div
                    style="
                        color:#c8a355;
                        font-size:10px;
                        font-weight:700;
                        letter-spacing:2px;
                        margin-top:3px;
                    "
                >
                    GERENCIAR EDITAIS
                </div>

            </div>


            <button
                id="btnVoltar"
                type="button"
                style="
                    border:1px solid #c8a355;
                    background:transparent;
                    color:#e5c378;
                    padding:9px 14px;
                    border-radius:7px;
                    cursor:pointer;
                    font-weight:700;
                "
            >
                ← Voltar
            </button>

        </div>

    </header>


    <main
        style="
            max-width:1200px;
            margin:0 auto;
            padding:35px 20px 60px;
        "
    >

        <section
            style="
                margin-bottom:30px;
            "
        >

            <div
                style="
                    color:#c8a355;
                    font-size:11px;
                    font-weight:800;
                    letter-spacing:2px;
                    margin-bottom:8px;
                "
            >
                ADMINISTRAÇÃO
            </div>


            <h1
                style="
                    margin:0;
                    color:#ffffff;
                    font-size:32px;
                    font-weight:800;
                "
            >
                📢 Editais
            </h1>


            <p
                style="
                    color:#8c95a3;
                    margin-top:8px;
                    font-size:14px;
                "
            >
                Adicione as imagens dos editais que serão
                exibidas na página inicial.
            </p>

        </section>


        <!-- ==========================================
             ÁREA DE ENVIO
        =========================================== -->

        <section
            style="
                background:#0e121a;
                border:1px solid #2a303b;
                border-radius:14px;
                padding:25px;
                margin-bottom:30px;
            "
        >

            <h2
                style="
                    margin:0 0 8px;
                    color:#ffffff;
                    font-size:20px;
                "
            >
                ➕ Adicionar edital
            </h2>


            <p
                style="
                    color:#7f8897;
                    font-size:13px;
                    margin-bottom:20px;
                "
            >
                Selecione uma imagem do edital
                diretamente do seu celular.
            </p>


            <input
                type="file"
                id="imagemEdital"
                accept="image/jpeg,image/png,image/webp"
                style="
                    width:100%;
                    max-width:500px;
                    padding:12px;
                    border:1px dashed #c8a355;
                    border-radius:8px;
                    background:#080a0f;
                    color:#ffffff;
                    cursor:pointer;
                "
            >


            <!-- PRÉVIA -->

            <div
                id="previewContainer"
                style="
                    display:none;
                    margin-top:20px;
                    max-width:500px;
                "
            >

                <div
                    style="
                        color:#c8a355;
                        font-size:12px;
                        font-weight:700;
                        margin-bottom:8px;
                    "
                >
                    PRÉVIA
                </div>


                <img
                    id="previewImagem"
                    src=""
                    alt="Prévia do edital"
                    style="
                        width:100%;
                        max-height:500px;
                        object-fit:contain;
                        display:block;
                        background:#080a0f;
                        border:1px solid #303744;
                        border-radius:10px;
                    "
                >

            </div>


            <div
                id="mensagemEdital"
                style="
                    margin-top:15px;
                    font-size:13px;
                "
            ></div>


            <button
                id="btnSalvarEdital"
                type="button"
                style="
                    margin-top:18px;
                    border:none;
                    background:#d4af37;
                    color:#080a0f;
                    padding:12px 22px;
                    border-radius:8px;
                    cursor:pointer;
                    font-weight:800;
                "
            >
                💾 Salvar edital
            </button>

        </section>


        <!-- ==========================================
             EDITAIS CADASTRADOS
        =========================================== -->

        <section>

            <h2
                style="
                    color:#ffffff;
                    font-size:20px;
                    margin-bottom:15px;
                "
            >
                📚 Editais cadastrados
            </h2>


            <div
                id="listaEditais"
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(auto-fill,minmax(220px,1fr));
                    gap:18px;
                "
            >

                <div
                    style="
                        color:#7f8897;
                        padding:20px 0;
                    "
                >
                    Carregando editais...
                </div>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="editais-admin.js"></script>

</body>

</html>
