<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Tático Curso</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>

<body>

    <main>

        <section class="hero">

            <div class="hero-text">

                <h1>Criar sua conta</h1>

                <p>
                    Cadastre-se para acessar o Tático Curso.
                </p>

                <form id="cadastroForm">

                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome completo"
                        required
                    >

                    <br><br>

                    <input
                        type="email"
                        id="email"
                        placeholder="Seu e-mail"
                        required
                    >

                    <br><br>

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="Telefone"
                    >

                    <br><br>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                        minlength="6"
                        required
                    >

                    <br><br>

                    <button type="submit">
                        Criar conta
                    </button>

                </form>

                <p id="mensagem"></p>

                <p>
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </div>

        </section>

    </main>

    <script src="cadastro.js"></script>

</body>

</html>
