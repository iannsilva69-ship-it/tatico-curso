<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área do Aluno - Tático Curso</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================================
           ÁREA DO ALUNO - TÁTICOS
           ========================================================= */

        body.aluno-page {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(200, 163, 85, 0.10),
                    transparent 28%
                ),
                #080A0F;
            color: #ffffff;
        }

        /* HEADER */

        body.aluno-page > header {
            min-height: 78px;
            padding: 0 6%;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(8, 10, 15, 0.97);
            border-bottom: 1px solid rgba(200, 163, 85, 0.22);
        }

        body.aluno-page > header h1 {
            margin: 0;
            color: #E5C378;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        body.aluno-page > header p {
            margin: 4px 0 0;
            color: #8f96a3;
            font-size: 12px;
        }

        body.aluno-page #logout {
            padding: 10px 20px;
            border: 1px solid rgba(200, 163, 85, 0.35);
            border-radius: 8px;

            background: transparent;
            color: #E5C378;

            font-size: 13px;
            font-weight: 800;
            cursor: pointer;

            transition: 0.2s;
        }

        body.aluno-page #logout:hover {
            background: rgba(200, 163, 85, 0.10);
            transform: translateY(-1px);
        }

        /* CONTEÚDO */

        body.aluno-page main {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;

            padding: 45px 24px 70px;
            box-sizing: border-box;
        }

        /* BOAS-VINDAS */

        body.aluno-page .boas-vindas {
            margin-bottom: 40px;
            padding: 30px;

            border-radius: 18px;
            border: 1px solid rgba(200, 163, 85, 0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(200, 163, 85, 0.08),
                    rgba(14, 18, 26, 0.95)
                );
        }

        body.aluno-page .boas-vindas h2 {
            margin: 0 0 8px;

            font-size: 28px;
            font-weight: 900;
        }

        body.aluno-page .boas-vindas p {
            margin: 0;

            color: #aeb4bf;
            font-size: 15px;
        }

        /* TÍTULOS DAS SEÇÕES */

        body.aluno-page main > section:not(.boas-vindas) {
            margin-bottom: 42px;
        }

        body.aluno-page main > section > h2 {
            margin: 0 0 20px;

            font-size: 22px;
            font-weight: 850;
            color: #ffffff;
        }

        /* CURSOS */

        body.aluno-page #listaCursos {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 22px;

            width: 100%;
        }

        /* SIMULADOS */

        body.aluno-page #listaSimulados {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 22px;

            width: 100%;
        }

        /* CARDS GERADOS PELO JS */

        body.aluno-page #listaCursos > *,
        body.aluno-page #listaSimulados > * {
            box-sizing: border-box;
        }

        /* =========================================================
           COMPATIBILIDADE COM OS CARDS ATUAIS
           ========================================================= */

        body.aluno-page #listaCursos img {
            max-width: 100%;
        }

        body.aluno-page #listaCursos button,
        body.aluno-page #listaSimulados button {
            transition: 0.2s;
        }

        body.aluno-page #listaCursos button:hover,
        body.aluno-page #listaSimulados button:hover {
            transform: translateY(-2px);
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            body.aluno-page > header {
                min-height: 70px;
                padding: 14px 18px;
            }

            body.aluno-page > header h1 {
                font-size: 18px;
            }

            body.aluno-page > header p {
                font-size: 11px;
            }

            body.aluno-page #logout {
                padding: 9px 15px;
                font-size: 12px;
            }

            body.aluno-page main {
                padding: 25px 15px 50px;
            }

            body.aluno-page .boas-vindas {
                padding: 24px 20px;
                border-radius: 14px;
                margin-bottom: 30px;
            }

            body.aluno-page .boas-vindas h2 {
                font-size: 23px;
            }

            body.aluno-page main > section > h2 {
                font-size: 20px;
            }

            body.aluno-page #listaCursos,
            body.aluno-page #listaSimulados {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="aluno-page">

<header>

    <div>
        <h1>TÁTICO CURSO</h1>
        <p>Área do Aluno</p>
    </div>

    <button id="logout">
        Sair
    </button>

</header>

<main>

    <section class="boas-vindas">

        <h2>
            Olá, aluno! 👋
        </h2>

        <p>
            Seja bem-vindo à sua área de estudos.
        </p>

    </section>

    <!-- CURSOS -->

    <section>

        <h2>
            📚 Meus Cursos
        </h2>

        <div id="listaCursos">

            <p>
                Carregando cursos...
            </p>

        </div>

    </section>

    <!-- SIMULADOS -->

    <section>

        <h2>
            📝 Simulados
        </h2>

        <div id="listaSimulados">

            <p>
                Carregando simulados...
            </p>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
<script src="aluno.js"></script>

</body>

</html>
