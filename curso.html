<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080A0F"
    >

    <title>Meu Curso - TÁTICOS CURSO</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        /* =====================================================
           TÁTICOS CURSO
           TELA DE ESTUDO
        ===================================================== */

        :root {

            --curso-bg: #080A0F;

            --curso-bg-2: #0D1118;

            --curso-card: #11161F;

            --curso-card-2: #151B25;

            --curso-border:
                rgba(255,255,255,0.08);

            --curso-border-gold:
                rgba(200,163,85,0.22);

            --curso-gold: #C8A355;

            --curso-gold-light: #E5C378;

            --curso-text: #F4F4F5;

            --curso-text-soft: #A8AFBA;

            --curso-green: #36C275;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body.pagina-curso {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(200,163,85,0.08),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 100% 30%,
                    rgba(200,163,85,0.035),
                    transparent 25%
                ),
                var(--curso-bg);

            color:
                var(--curso-text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .pagina-curso {

            min-height: 100vh;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .pagina-curso > header {

            position: sticky;

            top: 0;

            z-index: 100;

            min-height: 72px;

            padding:
                0 5%;

            box-sizing: border-box;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(8,10,15,0.94);

            border-bottom:
                1px solid var(--curso-border);

            backdrop-filter:
                blur(14px);
        }


        .marca-curso {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .logo-curso {

            width: 40px;

            height: 40px;

            object-fit: contain;

            border-radius: 9px;
        }


        .pagina-curso .logo {

            margin: 0;

            color:
                #ffffff;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1.4px;
        }


        .sublogo-curso {

            margin-top: 3px;

            color:
                var(--curso-gold-light);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 1.4px;

            text-transform:
                uppercase;
        }


        .pagina-curso nav {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .pagina-curso nav a {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 38px;

            padding:
                0 14px;

            box-sizing: border-box;

            border-radius: 8px;

            border:
                1px solid transparent;

            color:
                var(--curso-text-soft);

            text-decoration: none;

            font-size: 12px;

            font-weight: 750;

            transition:
                0.2s ease;
        }


        .pagina-curso nav a:hover {

            color:
                var(--curso-gold-light);

            background:
                rgba(200,163,85,0.07);

            border-color:
                rgba(200,163,85,0.20);
        }


        .pagina-curso nav #sair {

            color:
                var(--curso-gold-light);

            border-color:
                rgba(200,163,85,0.28);
        }


        /* =====================================================
           CABEÇALHO DO CURSO
        ===================================================== */

        .curso-cabecalho {

            position: relative;

            overflow: hidden;

            border-bottom:
                1px solid var(--curso-border-gold);

            background:
                linear-gradient(
                    135deg,
                    #0E121A 0%,
                    #111722 55%,
                    #0B0F16 100%
                );

            padding:
                58px 5%;
        }


        .curso-cabecalho::before {

            content: "";

            position: absolute;

            width: 430px;

            height: 430px;

            right: -170px;

            top: -230px;

            border:
                1px solid
                rgba(200,163,85,0.16);

            border-radius:
                50%;

            box-shadow:
                0 0 0 45px
                rgba(200,163,85,0.025),

                0 0 0 90px
                rgba(200,163,85,0.015),

                0 0 0 135px
                rgba(200,163,85,0.008);

            pointer-events: none;
        }


        .curso-cabecalho-conteudo {

            position: relative;

            z-index: 2;

            max-width:
                1200px;

            margin:
                0 auto;
        }


        .curso-tag {

            display:
                inline-flex;

            align-items:
                center;

            gap: 7px;

            padding:
                7px 13px;

            margin-bottom:
                17px;

            border:
                1px solid
                rgba(200,163,85,0.35);

            border-radius:
                999px;

            background:
                rgba(200,163,85,0.07);

            color:
                var(--curso-gold-light);

            font-size:
                10px;

            font-weight:
                850;

            letter-spacing:
                1.2px;
        }


        .curso-tag::before {

            content:
                "●";

            color:
                var(--curso-green);

            font-size:
                8px;
        }


        .curso-cabecalho h1 {

            max-width:
                850px;

            margin:
                0;

            color:
                #ffffff;

            font-size:
                clamp(30px, 5vw, 48px);

            line-height:
                1.08;

            font-weight:
                900;

            letter-spacing:
                -1px;
        }


        .curso-cabecalho p {

            max-width:
                760px;

            margin:
                17px 0 0;

            color:
                var(--curso-text-soft);

            font-size:
                15px;

            line-height:
                1.7;
        }


        /* =====================================================
           ÁREA PRINCIPAL
        ===================================================== */

        .conteudo-curso {

            width:
                100%;

            max-width:
                1200px;

            margin:
                0 auto;

            padding:
                42px 5% 80px;

            box-sizing:
                border-box;
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        .titulo-conteudo {

            display:
                flex;

            align-items:
                center;

            gap:
                14px;

            margin-bottom:
                25px;
        }


        .linha-dourada {

            width:
                45px;

            height:
                3px;

            flex-shrink:
                0;

            background:
                linear-gradient(
                    90deg,
                    var(--curso-gold),
                    var(--curso-gold-light)
                );

            border-radius:
                999px;
        }


        .titulo-conteudo h2 {

            margin:
                0;

            color:
                #ffffff;

            font-size:
                24px;

            font-weight:
                850;
        }


        /* =====================================================
           MÓDULOS
        ===================================================== */

        #modulos {

            display:
                flex;

            flex-direction:
                column;

            gap:
                18px;

            width:
                100%;
        }


        /* =====================================================
           CARD DO MÓDULO
        ===================================================== */

        .modulo-card {

            overflow:
                hidden;

            padding:
                0 !important;

            background:
                linear-gradient(
                    180deg,
                    var(--curso-card-2),
                    var(--curso-card)
                ) !important;

            border:
                1px solid
                var(--curso-border) !important;

            border-left:
                3px solid
                var(--curso-gold) !important;

            border-radius:
                14px !important;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.20) !important;
        }


        .modulo-card h3 {

            margin:
                0 !important;

            padding:
                20px 22px;

            color:
                var(--curso-gold-light) !important;

            background:
                rgba(200,163,85,0.035);

            border-bottom:
                1px solid
                var(--curso-border);

            font-size:
                18px;

            font-weight:
                850;
        }


        /* =====================================================
           CARD DA AULA
        ===================================================== */

        .aula-card {

            position:
                relative;

            margin:
                12px !important;

            padding:
                18px !important;

            box-sizing:
                border-box;

            background:
                #0D121A !important;

            border:
                1px solid
                var(--curso-border) !important;

            border-radius:
                10px !important;

            color:
                var(--curso-text) !important;

            transition:
                border-color 0.2s ease,
                transform 0.2s ease,
                background 0.2s ease;
        }


        .aula-card:hover {

            border-color:
                rgba(200,163,85,0.22)
                !important;

            background:
                #101620 !important;

            transform:
                translateY(-1px);
        }


        .aula-card h4 {

            margin:
                0 0 12px;

            color:
                #F1F3F5 !important;

            font-size:
                15px;

            line-height:
                1.4;

            font-weight:
                800;
        }


        .aula-card p {

            margin:
                7px 0;

            color:
                var(--curso-text-soft) !important;

            font-size:
                13px;

            line-height:
                1.5;
        }


        /* =====================================================
           LINKS / BOTÕES
        ===================================================== */

        .aula-card a {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                38px;

            margin:
                8px 7px 0 0;

            padding:
                0 13px;

            box-sizing:
                border-box;

            border-radius:
                7px;

            text-decoration:
                none;

            font-size:
                12px;

            font-weight:
                800;

            transition:
                0.2s ease;
        }


        .aula-card a:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.08);
        }


        .link-video {

            background:
                rgba(200,163,85,0.08)
                !important;

            border:
                1px solid
                rgba(200,163,85,0.28);

            color:
                var(--curso-gold-light)
                !important;
        }


        .link-material {

            background:
                rgba(255,255,255,0.035)
                !important;

            border:
                1px solid
                rgba(255,255,255,0.09);

            color:
                #D9DDE3
                !important;
        }


        /* =====================================================
           ÁREA DA IA
        ===================================================== */

        .area-ia {

            margin-top:
                18px !important;

            padding:
                18px !important;

            box-sizing:
                border-box;

            background:
                linear-gradient(
                    135deg,
                    rgba(200,163,85,0.07),
                    rgba(17,22,31,0.96)
                ) !important;

            border:
                1px solid
                rgba(200,163,85,0.20)
                !important;

            border-radius:
                11px !important;

            color:
                #ffffff !important;
        }


        .area-ia p {

            margin-top:
                0;

            color:
                var(--curso-text-soft);
        }


        .area-ia textarea {

            width:
                100% !important;

            min-height:
                100px;

            padding:
                13px !important;

            box-sizing:
                border-box;

            background:
                #080A0F !important;

            color:
                #ffffff !important;

            border:
                1px solid
                rgba(200,163,85,0.20)
                !important;

            border-radius:
                8px !important;

            resize:
                vertical;

            font-family:
                inherit;

            font-size:
                13px;

            margin-bottom:
                10px;
        }


        .area-ia textarea::placeholder {

            color:
                #69717D;
        }


        .area-ia textarea:focus {

            outline:
                none;

            border-color:
                var(--curso-gold)
                !important;
        }


        .area-ia button {

            padding:
                10px 17px !important;

            border:
                none !important;

            border-radius:
                7px !important;

            background:
                linear-gradient(
                    135deg,
                    var(--curso-gold),
                    var(--curso-gold-light)
                ) !important;

            color:
                #080A0F !important;

            font-size:
                12px;

            font-weight:
                850;

            cursor:
                pointer;

            transition:
                0.2s ease;
        }


        .area-ia button:hover {

            transform:
                translateY(-1px);

            filter:
                brightness(1.08);
        }


        /* =====================================================
           BOTÕES GERADOS PELO CURSO.JS
        ===================================================== */

        #modulos button {

            border-radius:
                7px;

            font-weight:
                750;

            cursor:
                pointer;

            transition:
                0.2s ease;
        }


        #modulos button:hover {

            transform:
                translateY(-1px);
        }


        /* =====================================================
           MENSAGEM DE CARREGAMENTO
        ===================================================== */

        #modulos {

            color:
                var(--curso-text-soft);

            font-size:
                14px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .pagina-curso > header {

                min-height:
                    66px;

                padding:
                    0 16px;
            }


            .logo-curso {

                width:
                    35px;

                height:
                    35px;
            }


            .pagina-curso .logo {

                font-size:
                    15px;

                letter-spacing:
                    1px;
            }


            .sublogo-curso {

                font-size:
                    8px;
            }


            .pagina-curso nav {

                gap:
                    4px;
            }


            .pagina-curso nav a {

                min-height:
                    34px;

                padding:
                    0 9px;

                font-size:
                    10px;
            }


            .curso-cabecalho {

                padding:
                    40px 18px;
            }


            .curso-cabecalho h1 {

                font-size:
                    30px;
            }


            .curso-cabecalho p {

                font-size:
                    13px;

                line-height:
                    1.6;
            }


            .conteudo-curso {

                padding:
                    32px 15px 60px;
            }


            .titulo-conteudo {

                gap:
                    9px;

                margin-bottom:
                    20px;
            }


            .titulo-conteudo h2 {

                font-size:
                    20px;
            }


            .linha-dourada {

                width:
                    32px;
            }


            .modulo-card h3 {

                padding:
                    17px;

                font-size:
                    16px;
            }


            .aula-card {

                margin:
                    10px !important;

                padding:
                    15px !important;
            }


            .aula-card h4 {

                font-size:
                    14px;
            }


            .aula-card a {

                display:
                    flex;

                width:
                    100%;

                margin:
                    8px 0 0;

                box-sizing:
                    border-box;
            }


            .area-ia {

                padding:
                    15px !important;
            }

        }


        /* =====================================================
           CELULAR PEQUENO
        ===================================================== */

        @media (max-width: 420px) {

            .pagina-curso .logo {

                font-size:
                    13px;
            }


            .sublogo-curso {

                display:
                    none;
            }


            .pagina-curso nav a:first-child {

                display:
                    none;
            }


            .curso-cabecalho h1 {

                font-size:
                    27px;
            }

        }

    </style>

</head>


<body class="pagina-curso">


<div class="pagina-curso">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="marca-curso">

            <img
                src="icons/logo-192.png"
                alt="TÁTICOS"
                class="logo-curso"
            >

            <div>

                <div class="logo">
                    TÁTICOS CURSO
                </div>

                <div class="sublogo-curso">
                    Área de estudos
                </div>

            </div>

        </div>


        <nav>

            <a href="aluno.html">
                ← Minha área
            </a>


            <a
                href="#"
                id="sair"
            >
                Sair
            </a>

        </nav>

    </header>


    <!-- =====================================================
         CABEÇALHO DO CURSO
    ====================================================== -->

    <section class="curso-cabecalho">

        <div class="curso-cabecalho-conteudo">

            <span class="curso-tag">
                ÁREA DE ESTUDOS
            </span>


            <h1 id="nomeCurso">
                Carregando curso...
            </h1>


            <p id="descricaoCurso">
                Carregando informações do curso...
            </p>

        </div>

    </section>


    <!-- =====================================================
         CONTEÚDO DO CURSO
    ====================================================== -->

    <main class="conteudo-curso">


        <div class="titulo-conteudo">

            <div class="linha-dourada"></div>

            <h2>
                Conteúdo do curso
            </h2>

        </div>


        <div id="modulos">

            Carregando módulos...

        </div>


    </main>


</div>


<script src="curso.js"></script>


</body>

</html>
