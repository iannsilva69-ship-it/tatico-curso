<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Curso - Tático Curso</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>

        /* =========================================================
           TÁTICOS - ÁREA DE ESTUDOS
           ========================================================= */

        body {
            margin: 0 !important;
            padding: 0 !important;
            background: #080A0F !important;
            color: #ffffff !important;
            min-height: 100vh;
        }

        .pagina-curso {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(200, 163, 85, 0.08),
                    transparent 30%
                ),
                #080A0F;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .pagina-curso > header {
            min-height: 76px;

            padding: 0 6%;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(8, 10, 15, 0.97);

            border-bottom: 1px solid rgba(200, 163, 85, 0.22);

            position: relative;
            z-index: 10;
        }

        .pagina-curso .logo {
            color: #E5C378;

            font-size: 21px;
            font-weight: 900;

            letter-spacing: 2px;
        }

        .pagina-curso nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .pagina-curso nav a {
            color: #b8bec9;

            text-decoration: none;

            font-size: 13px;
            font-weight: 700;

            transition: 0.2s;
        }

        .pagina-curso nav a:hover {
            color: #E5C378;
        }


        /* =========================================================
           CABEÇALHO DO CURSO
           ========================================================= */

        .curso-cabecalho {

            background:
                radial-gradient(
                    circle at 90% 20%,
                    rgba(200, 163, 85, 0.08),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #0E121A,
                    #111722
                ) !important;

            color: white;

            padding: 60px 6% !important;

            border-bottom: 1px solid rgba(200, 163, 85, 0.35) !important;

            position: relative;

            overflow: hidden;
        }

        .curso-cabecalho::before {

            content: "";

            position: absolute;

            width: 420px;
            height: 420px;

            right: -150px;
            top: -210px;

            border: 1px solid rgba(200, 163, 85, 0.18);

            border-radius: 50%;

            box-shadow:
                0 0 0 45px rgba(200, 163, 85, 0.025),
                0 0 0 90px rgba(200, 163, 85, 0.018);
        }

        .curso-cabecalho-conteudo {

            max-width: 1200px;

            margin: auto;

            position: relative;

            z-index: 2;
        }

        .curso-tag {

            display: inline-block;

            color: #E5C378 !important;

            background: rgba(200, 163, 85, 0.06);

            border: 1px solid rgba(200, 163, 85, 0.45) !important;

            padding: 7px 14px;

            border-radius: 999px;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 1.2px;

            margin-bottom: 18px;
        }

        .curso-cabecalho h1 {

            margin: 0;

            font-size: clamp(34px, 5vw, 52px);

            line-height: 1.05;

            color: #ffffff !important;

            font-weight: 900;

            letter-spacing: -1px;
        }

        .curso-cabecalho p {

            max-width: 760px;

            margin: 18px 0 0;

            color: #aeb5c1 !important;

            font-size: 16px;

            line-height: 1.7;
        }


        /* =========================================================
           CONTEÚDO
           ========================================================= */

        .conteudo-curso {

            max-width: 1200px;

            margin: auto;

            padding: 50px 24px 80px !important;

            box-sizing: border-box;
        }

        .titulo-conteudo {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 28px;
        }

        .titulo-conteudo h2 {

            margin: 0;

            font-size: 28px;

            color: #ffffff !important;

            font-weight: 850;
        }

        .linha-dourada {

            height: 3px;

            width: 55px;

            background: #C8A355 !important;

            border-radius: 5px;

            flex-shrink: 0;
        }


        /* =========================================================
           MÓDULOS
           ========================================================= */

        #modulos {

            display: flex;

            flex-direction: column;

            gap: 22px;

            width: 100%;
        }

        .modulo-card {

            background: #0E121A !important;

            border: 1px solid rgba(200, 163, 85, 0.18) !important;

            border-left: 4px solid #C8A355 !important;

            border-radius: 14px !important;

            padding: 24px !important;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.22) !important;
        }

        .modulo-card h3 {

            margin: 0 0 18px;

            color: #E5C378 !important;

            font-size: 21px;

            font-weight: 800;
        }


        /* =========================================================
           AULAS
           ========================================================= */

        .aula-card {

            background: #080A0F !important;

            border: 1px solid rgba(200, 163, 85, 0.13) !important;

            border-radius: 11px !important;

            padding: 20px !important;

            margin-top: 14px !important;

            box-sizing: border-box;
        }

        .aula-card h4 {

            margin: 0 0 15px;

            color: #ffffff !important;

            font-size: 16px;

            font-weight: 750;
        }


        /* =========================================================
           LINKS / BOTÕES DAS AULAS
           ========================================================= */

        .aula-card a {

            display: inline-block;

            margin-right: 8px;

            margin-top: 8px;

            padding: 10px 14px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 750;

            transition: 0.2s;
        }

        .aula-card a:hover {

            transform: translateY(-1px);

            opacity: 0.92;
        }

        .link-video {

            background: #111827 !important;

            border: 1px solid rgba(200, 163, 85, 0.25);

            color: #ffffff !important;
        }

        .link-material {

            background: #1a1f29 !important;

            border: 1px solid rgba(255, 255, 255, 0.08);

            color: #d8dce3 !important;
        }


        /* =========================================================
           ÁREA DA IA
           ========================================================= */

        .area-ia {

            margin-top: 20px !important;

            padding: 20px !important;

            background: #0E121A !important;

            border: 1px solid rgba(200, 163, 85, 0.20) !important;

            border-radius: 11px !important;

            box-sizing: border-box;
        }

        .area-ia textarea {

            width: 100% !important;

            box-sizing: border-box;

            padding: 13px !important;

            background: #080A0F !important;

            color: #ffffff !important;

            border: 1px solid rgba(200, 163, 85, 0.20) !important;

            border-radius: 8px !important;

            resize: vertical;

            font-family: inherit;

            margin-bottom: 10px;
        }

        .area-ia textarea::placeholder {

            color: #737b88;
        }

        .area-ia textarea:focus {

            outline: none;

            border-color: #C8A355 !important;
        }

        .area-ia button {

            background: linear-gradient(
                135deg,
                #C8A355,
                #E5C378
            ) !important;

            color: #080A0F !important;

            padding: 10px 17px !important;

            border: none !important;

            border-radius: 7px !important;

            cursor: pointer;

            font-weight: 850;

            transition: 0.2s;
        }

        .area-ia button:hover {

            transform: translateY(-1px);

            opacity: 0.95;
        }


        /* =========================================================
           ELEMENTOS GERADOS PELO CURSO.JS
           ========================================================= */

        #modulos button {

            border-radius: 7px;

            font-weight: 750;

            cursor: pointer;

            transition: 0.2s;
        }

        #modulos button:hover {

            transform: translateY(-1px);
        }


        /* =========================================================
           PROGRESSO
           ========================================================= */

        #modulos [style*="progress"],
        #modulos [style*="Progresso"],
        #modulos [style*="progresso"] {

            box-sizing: border-box;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            .pagina-curso > header {

                min-height: 70px;

                padding: 14px 18px;
            }

            .pagina-curso .logo {

                font-size: 17px;
            }

            .pagina-curso nav {

                gap: 13px;
            }

            .pagina-curso nav a {

                font-size: 11px;
            }

            .curso-cabecalho {

                padding: 42px 20px !important;
            }

            .curso-cabecalho h1 {

                font-size: 34px;
            }

            .curso-cabecalho p {

                font-size: 15px;
            }

            .conteudo-curso {

                padding: 35px 15px 60px !important;
            }

            .titulo-conteudo {

                gap: 10px;

                margin-bottom: 22px;
            }

            .titulo-conteudo h2 {

                font-size: 22px;
            }

            .linha-dourada {

                width: 35px;
            }

            .modulo-card {

                padding: 18px !important;
            }

            .aula-card {

                padding: 16px !important;
            }

            .aula-card a {

                display: block;

                width: 100%;

                box-sizing: border-box;

                text-align: center;

                margin-right: 0;
            }

            .area-ia {

                padding: 15px !important;
            }
        }

    </style>

</head>


<body>

    <div class="pagina-curso">


        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header>

            <div class="logo">
                TÁTICO CURSO
            </div>

            <nav>

                <a href="aluno.html">
                    Minha área
                </a>

                <a href="#" id="sair">
                    Sair
                </a>

            </nav>

        </header>


        <!-- =====================================================
             INFORMAÇÕES DO CURSO
             ===================================================== -->

        <section class="curso-cabecalho">

            <div class="curso-cabecalho-conteudo">

                <span class="curso-tag">
                    MEU CURSO
                </span>

                <h1 id="nomeCurso">
                    Carregando curso...
                </h1>

                <p id="descricaoCurso">
                    Carregando informações...
                </p>

            </div>

        </section>


        <!-- =====================================================
             CONTEÚDO
             ===================================================== -->

        <main class="conteudo-curso">

            <div class="titulo-conteudo">

                <div class="linha-dourada"></div>

                <h2>
                    Conteúdo do curso
                </h2>

            </div>


            <!--
                O curso.js continua responsável por:
                - módulos
                - aulas
                - progresso
                - vídeos
                - PDFs
                - questões
                - slides
                - IA
            -->

            <div id="modulos">

                Carregando módulos...

            </div>

        </main>

    </div>


    <script src="curso.js"></script>

</body>

</html>
